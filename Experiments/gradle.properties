# Gradle Properties for MPC Experiments

# AndroidX (REQUIRED - fixes the AndroidX warning)
android.useAndroidX=true
android.enableJetifier=true

# JVM Memory Settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel Build
org.gradle.parallel=true

# Daemon
org.gradle.daemon=true

# Configuration Cache (experimental but faster)
org.gradle.configuration-cache=true

# Android Specific
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official

# Network Timeouts (fix for slow Gradle distribution downloads)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
